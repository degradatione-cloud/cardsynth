name: Build CardSynth firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch components
        run: |
          python3 ./fetch_repos.py

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Merge flashable image
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd build
          esptool.py --chip esp32s3 merge_bin -o cardsynth_full_0x0.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 cardsynth.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cardsynth-firmware
          path: |
            build/cardsynth_full_0x0.bin
            build/cardsynth.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
